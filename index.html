<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#475af3" />
  <link rel="manifest" href="/manifest.json" />
  <title>Infanti</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e6e6e6;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash p {
      font-family: 'Nunito', sans-serif;
      font-size: 24px;
      color: #475af3;
    }
  </style>
</head>
<body>
  <div id="splash"><p>🎵 Toque para iniciar</p></div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
